<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Agenda · III SCB</title>
  <meta name="description" content="Agenda escolar con asistente de IA, plan de estudio y metas diarias.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Barra superior -->
    <header class="topbar">
      <div class="brand"><span class="logo">📅</span><div><b>Mi Agenda</b><small>III SCB · Raimondi</small></div></div>
      <nav class="tabs" role="tablist">
        <button data-view="week" class="tab active">Semana</button>
        <button data-view="month" class="tab">Mes</button>
        <button data-view="goals" class="tab">Metas</button>
      </nav>
      <div class="datenav">
        <button id="prevBtn" class="icon-btn" title="Anterior">‹</button>
        <button id="todayBtn" class="btn ghost">Hoy</button>
        <button id="nextBtn" class="icon-btn" title="Siguiente">›</button>
        <span id="rangeLabel" class="range-label"></span>
      </div>
      <div class="top-actions">
        <button id="addBtn" class="btn primary">＋ Nuevo</button>
        <button id="themeBtn" class="icon-btn" title="Modo claro/oscuro">🌓</button>
        <button id="settingsBtn" class="icon-btn" title="Ajustes">⚙️</button>
        <button id="chatToggle" class="icon-btn" title="Asistente">✨</button>
      </div>
    </header>

    <!-- Lateral izquierdo -->
    <aside class="sidebar">
      <section class="card summary-card">
        <div class="card-head"><h3 id="todayTitle">Hoy</h3><button id="refreshSummary" class="icon-btn sm" title="Actualizar resumen">↻</button></div>
        <p id="summaryText" class="summary-text"></p>
      </section>
      <section class="card">
        <div class="card-head"><h3>Metas de hoy</h3><button class="link" data-goto="goals">ver todo</button></div>
        <div id="todayGoals" class="today-goals"></div>
      </section>
      <section class="card">
        <div class="card-head"><h3>Próximos</h3><label class="mini-check"><input type="checkbox" id="showDone"> hechos</label></div>
        <div id="upcoming" class="upcoming"></div>
      </section>
    </aside>

    <!-- Vista principal -->
    <main class="main" id="main"></main>

    <!-- Asistente IA -->
    <aside class="chat" id="chat">
      <div class="chat-head">
        <div class="avatar">🌙</div>
        <div><b>Luna</b><small id="aiStatus">asistente</small></div>
        <button id="clearChat" class="icon-btn sm" title="Borrar conversación">🗑️</button>
        <button id="closeChat" class="icon-btn sm only-mobile" title="Cerrar">✕</button>
      </div>
      <div id="chatLog" class="chat-log"></div>
      <div id="chatSuggest" class="chat-suggest"></div>
      <form id="chatForm" class="chat-form">
        <textarea id="chatInput" rows="2" placeholder="Ej: Tengo examen de mate el jueves, entra hasta derivadas"></textarea>
        <button class="btn primary" type="submit">➤</button>
      </form>
    </aside>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts"></div>

  <script src="js/data.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
